spring:
  application:
    name: hopestar-hfms

  profiles:
    active: ${HFMS_PROFILE:dev}

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Schema is owned entirely by Flyway migrations,
                            # never by Hibernate — see approved architecture
                            # §7.3. "validate" fails fast at startup if the
                            # entities and the migrated schema disagree.
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
      timeout: 30m
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------------
# HFMS-specific configuration
# ---------------------------------------------------------------------
hfms:
  file-storage:
    documents-path: ${HFMS_DOCS_PATH:./data/documents}
    receipts-path: ${HFMS_RECEIPTS_PATH:./data/receipts}
    backup-path: ${HFMS_BACKUP_PATH:./data/backups}
    max-file-size-mb: 10

  security:
    max-failed-login-attempts: 5

  student:
    code-prefix: STU

  employee:
    code-prefix: EMP

  backup:
    auto-backup-enabled: true
    auto-backup-cron: "0 0 2 * * *"   # daily at 02:00
    # No automatic retention/cleanup setting: by explicit product decision
    # the system never deletes a backup on its own -- only the manual
    # "Delete" action (BackupService.deleteBackup) ever removes one.
    # Neither tool is guaranteed to be on PATH; default assumes it is
    # (typical for a Linux prod host with the mysql-client package
    # installed) and profiles override with an absolute path where
    # needed -- see application-dev.yml.
    mysqldump-path: ${HFMS_MYSQLDUMP_PATH:mysqldump}
    mysql-restore-path: ${HFMS_MYSQL_PATH:mysql}

logging:
  level:
    root: INFO
    com.hopestar.hfms: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
