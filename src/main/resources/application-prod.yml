spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:hfms_prod}?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: hfms-prod-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  thymeleaf:
    cache: true

  devtools:
    restart:
      enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        secure: true       # requires HTTPS in production, per approved
                            # Security Architecture §5.4
        http-only: true
        same-site: strict
  forward-headers-strategy: native   # honor X-Forwarded-* when behind a
                                      # reverse proxy / load balancer

logging:
  level:
    root: WARN
    com.hopestar.hfms: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  file:
    name: /var/log/hfms/hfms.log

hfms:
  backup:
    auto-backup-enabled: true
