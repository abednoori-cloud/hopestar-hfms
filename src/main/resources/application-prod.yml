spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:hfms_prod}?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: hfms-prod-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  thymeleaf:
    cache: true

  devtools:
    restart:
      enabled: false

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${HFMS_SSL_KEYSTORE:classpath:hfms-keystore.p12}
    key-store-password: ${HFMS_SSL_KEYSTORE_PASSWORD:@hfms.ssl.keystore.password@}
    key-store-type: PKCS12
    key-alias: hfms
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        secure: true       # requires HTTPS in production, per approved
                            # Security Architecture §5.4 -- correct as-is
                            # now that server.ssl is enabled above; do not
                            # weaken this to make plain HTTP "work".
        http-only: true
        same-site: strict
  forward-headers-strategy: native   # honor X-Forwarded-* when behind a
                                      # reverse proxy / load balancer

logging:
  level:
    root: WARN
    com.hopestar.hfms: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  file:
    name: /var/log/hfms/hfms.log

# No hfms.backup.* overrides here: auto-backup-enabled/cron now live in
# backup_schedule_settings (admin-editable at runtime), not application.yml
# -- see BackupProperties/BackupSchedule. mysqldump-path/mysql-restore-path
# fall through to application.yml's env-var-driven defaults (bare
# "mysqldump"/"mysql", assumed on PATH via the mysql-client package).
