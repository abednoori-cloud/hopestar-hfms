spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hfms_dev}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:hfms_user}
    password: ${DB_PASSWORD:hfms_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: hfms-dev-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.hopestar.hfms: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

hfms:
  backup:
    auto-backup-enabled: false   # avoid clutter while developing locally
    # This machine's MySQL Server 9.7 install -- version-matched to the
    # running server, unlike the older copy bundled with MySQL Workbench.
    mysqldump-path: ${HFMS_MYSQLDUMP_PATH:C:/Program Files/MySQL/MySQL Server 9.7/bin/mysqldump.exe}
    mysql-restore-path: ${HFMS_MYSQL_PATH:C:/Program Files/MySQL/MySQL Server 9.7/bin/mysql.exe}
