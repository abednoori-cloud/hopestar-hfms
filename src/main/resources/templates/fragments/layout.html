<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:fragment="head(pageTitle)" th:text="${pageTitle} + ' · HopeStar'">HopeStar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: 600; letter-spacing: .02em; }
        .hfms-card { border: none; border-radius: .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .table-hfms thead th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: #6c757d; border-top: none; }
        .badge-status-active { background-color: #198754; }
        .badge-status-inactive { background-color: #6c757d; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background-color:#1e2a38;">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="bi bi-mortarboard-fill me-1"></i> HopeStar HFMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hfmsNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="hfmsNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/students">Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees">Employees</a></li>
                <li class="nav-item"><a class="nav-link" href="/salaries">Salaries</a></li>
                <li class="nav-item"><a class="nav-link" href="/loans">Loans</a></li>
                <li class="nav-item"><a class="nav-link" href="/payments">Payments</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm" type="submit">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="breadcrumbs(items)" class="container-fluid mt-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li th:each="item : ${items}"
                th:class="${itemStat.last} ? 'breadcrumb-item active' : 'breadcrumb-item'">
                <a th:if="${!itemStat.last and item.url != null}" th:href="${item.url}" th:text="${item.label}">Label</a>
                <span th:unless="${!itemStat.last and item.url != null}" th:text="${item.label}">Label</span>
            </li>
        </ol>
    </nav>
</div>

<div th:fragment="flashMessages" class="container-fluid">
    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${successMessage != null}">
        <i class="bi bi-check-circle-fill me-1"></i><span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert"
         th:if="${errorMessage != null}">
        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div th:fragment="scripts">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
