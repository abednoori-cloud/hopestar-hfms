<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle=${isEdit} ? 'Edit Loan' : 'New Loan')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: breadcrumbs(items=${ {
    {label: 'Dashboard', url: '/dashboard'},
    {label: 'Loans', url: '/loans'},
    {label: ${isEdit} ? 'Edit Loan' : 'New Loan', url: null}
} } })}"></div>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card hfms-card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0" th:if="${!isEdit}"><i class="bi bi-piggy-bank me-2"></i>New Loan (Draft)</h5>
                    <h5 class="mb-0" th:if="${isEdit}">
                        <i class="bi bi-pencil-square me-2"></i>Edit Draft Loan
                        <span class="text-muted fs-6" th:text="'(' + ${loan.loanNumber} + ')'"></span>
                    </h5>
                </div>
                <div class="card-body">

                    <!-- CREATE -->
                    <form th:if="${!isEdit}" method="post" th:action="@{/loans}" th:object="${createDTO}" novalidate>

                        <div class="row g-3 mb-1">
                            <div class="col-md-6" th:if="${selectedEmployee != null}">
                                <label class="form-label">Employee</label>
                                <input type="text" class="form-control" readonly
                                       th:value="${selectedEmployee.fullName} + ' (' + ${selectedEmployee.employeeCode} + ')'"/>
                                <input type="hidden" th:field="*{employeeId}"/>
                            </div>
                            <div class="col-md-6" th:if="${selectedEmployee == null}">
                                <label class="form-label">Employee ID *</label>
                                <input type="number" class="form-control" th:field="*{employeeId}"
                                       th:classappend="${#fields.hasErrors('employeeId')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
                                <div class="form-text">Tip: open this form from an employee's detail page to have this filled in automatically.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Loan Date *</label>
                                <input type="date" class="form-control" th:field="*{loanDate}"
                                       th:classappend="${#fields.hasErrors('loanDate')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('loanDate')}" th:errors="*{loanDate}"></div>
                            </div>
                        </div>

                        <hr/>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Loan Amount *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{loanAmount}"
                                       th:classappend="${#fields.hasErrors('loanAmount')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('loanAmount')}" th:errors="*{loanAmount}"></div>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Currency *</label>
                                <select class="form-select currency-select" th:field="*{currency}"
                                        th:classappend="${#fields.hasErrors('currency')} ? 'is-invalid'">
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="AFN">AFN</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Rate to USD *</label>
                                <input type="number" step="0.000001" min="0.000001" class="form-control exchange-rate-input"
                                       th:field="*{exchangeRateToUsd}"
                                       th:classappend="${#fields.hasErrors('exchangeRateToUsd')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('exchangeRateToUsd')}" th:errors="*{exchangeRateToUsd}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Monthly Deduction *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{monthlyDeduction}"
                                       th:classappend="${#fields.hasErrors('monthlyDeduction')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('monthlyDeduction')}" th:errors="*{monthlyDeduction}"></div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Start Month *</label>
                                <select class="form-select" th:field="*{startMonth}"
                                        th:classappend="${#fields.hasErrors('startMonth')} ? 'is-invalid'">
                                    <option value="">Select…</option>
                                    <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('startMonth')}" th:errors="*{startMonth}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Start Year *</label>
                                <input type="number" class="form-control" th:field="*{startYear}"
                                       th:classappend="${#fields.hasErrors('startYear')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('startYear')}" th:errors="*{startYear}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">End Month *</label>
                                <select class="form-select" th:field="*{endMonth}"
                                        th:classappend="${#fields.hasErrors('endMonth')} ? 'is-invalid'">
                                    <option value="">Select…</option>
                                    <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('endMonth')}" th:errors="*{endMonth}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">End Year *</label>
                                <input type="number" class="form-control" th:field="*{endYear}"
                                       th:classappend="${#fields.hasErrors('endYear')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('endYear')}" th:errors="*{endYear}"></div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Remarks</label>
                                <textarea class="form-control" rows="2" th:field="*{remarks}"></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <a class="btn btn-outline-secondary me-2" th:href="@{/loans}">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save as Draft</button>
                        </div>
                    </form>

                    <!-- EDIT DRAFT -->
                    <form th:if="${isEdit}" method="post" th:action="@{/loans/{id}/edit(id=${loanId})}" th:object="${updateDTO}" novalidate>
                        <div class="row g-3 mb-1">
                            <div class="col-md-6">
                                <label class="form-label">Employee</label>
                                <input type="text" class="form-control" readonly
                                       th:value="${loan.employeeFullName} + ' (' + ${loan.employeeCode} + ')'"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Loan Date *</label>
                                <input type="date" class="form-control" th:field="*{loanDate}"
                                       th:classappend="${#fields.hasErrors('loanDate')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('loanDate')}" th:errors="*{loanDate}"></div>
                            </div>
                        </div>

                        <hr/>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Loan Amount *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{loanAmount}"
                                       th:classappend="${#fields.hasErrors('loanAmount')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('loanAmount')}" th:errors="*{loanAmount}"></div>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Currency *</label>
                                <select class="form-select currency-select" th:field="*{currency}"
                                        th:classappend="${#fields.hasErrors('currency')} ? 'is-invalid'">
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="AFN">AFN</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Rate to USD *</label>
                                <input type="number" step="0.000001" min="0.000001" class="form-control exchange-rate-input"
                                       th:field="*{exchangeRateToUsd}"
                                       th:classappend="${#fields.hasErrors('exchangeRateToUsd')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('exchangeRateToUsd')}" th:errors="*{exchangeRateToUsd}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Monthly Deduction *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{monthlyDeduction}"
                                       th:classappend="${#fields.hasErrors('monthlyDeduction')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('monthlyDeduction')}" th:errors="*{monthlyDeduction}"></div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Start Month *</label>
                                <select class="form-select" th:field="*{startMonth}"
                                        th:classappend="${#fields.hasErrors('startMonth')} ? 'is-invalid'">
                                    <option value="">Select…</option>
                                    <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('startMonth')}" th:errors="*{startMonth}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Start Year *</label>
                                <input type="number" class="form-control" th:field="*{startYear}"
                                       th:classappend="${#fields.hasErrors('startYear')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('startYear')}" th:errors="*{startYear}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">End Month *</label>
                                <select class="form-select" th:field="*{endMonth}"
                                        th:classappend="${#fields.hasErrors('endMonth')} ? 'is-invalid'">
                                    <option value="">Select…</option>
                                    <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('endMonth')}" th:errors="*{endMonth}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">End Year *</label>
                                <input type="number" class="form-control" th:field="*{endYear}"
                                       th:classappend="${#fields.hasErrors('endYear')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('endYear')}" th:errors="*{endYear}"></div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Remarks</label>
                                <textarea class="form-control" rows="2" th:field="*{remarks}"></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <a class="btn btn-outline-secondary me-2" th:href="@{/loans/{id}(id=${loanId})}">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    // Convenience only: the server always enforces exchangeRateToUsd == 1
    // for USD (see MoneyUtil.resolveExchangeRateToUsd, the single shared
    // implementation used identically by every module).
    document.querySelectorAll('.currency-select').forEach(function (select) {
        var form = select.closest('form');
        var rateInput = form.querySelector('.exchange-rate-input');
        function syncRate() {
            if (select.value === 'USD') {
                rateInput.value = '1';
                rateInput.setAttribute('readonly', 'readonly');
            } else {
                rateInput.removeAttribute('readonly');
            }
        }
        select.addEventListener('change', syncRate);
        syncRate();
    });
</script>
</body>
</html>
