<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid pb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card hfms-card">
                <div class="card-body text-center p-5">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
                    <h4 class="mt-3">Something went wrong</h4>
                    <!--
                        errorMessage is always a safe, user-facing string set
                        by GlobalExceptionHandler -- never the raw exception
                        message or a stack trace. Nothing technical is ever
                        rendered here, per the approved Security Architecture.
                    -->
                    <p class="text-muted" th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again or contact the administrator.'">
                        An unexpected error occurred.
                    </p>
                    <a class="btn btn-primary mt-2" href="/dashboard"><i class="bi bi-house-fill me-1"></i>Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
