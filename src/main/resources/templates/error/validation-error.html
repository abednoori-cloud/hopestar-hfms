<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Validation Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid pb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card hfms-card">
                <div class="card-body p-5">
                    <div class="text-center">
                        <i class="bi bi-exclamation-circle-fill text-warning" style="font-size: 3rem;"></i>
                        <h4 class="mt-3">The submitted data was invalid</h4>
                        <p class="text-muted">Please correct the following and try again:</p>
                    </div>
                    <!--
                        fieldErrors is a plain field-name -> message map built
                        by GlobalExceptionHandler from Bean Validation results
                        -- never raw exception details.
                    -->
                    <ul class="list-group" th:if="${fieldErrors != null and !fieldErrors.isEmpty()}">
                        <li class="list-group-item d-flex justify-content-between align-items-start"
                            th:each="fieldError : ${fieldErrors}">
                            <span class="fw-semibold" th:text="${fieldError.key}">field</span>
                            <span class="text-danger" th:text="${fieldError.value}">message</span>
                        </li>
                    </ul>
                    <div class="text-center mt-4">
                        <a class="btn btn-primary" href="/dashboard"><i class="bi bi-house-fill me-1"></i>Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
