<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Expenses')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: breadcrumbs(items=${ {
    {label: 'Dashboard', url: '/dashboard'},
    {label: 'Expenses', url: null}
} })}"></div>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid pb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-receipt me-2"></i>Expenses</h4>
        <a class="btn btn-primary" href="/expenses/new"><i class="bi bi-plus-lg me-1"></i>New Expense</a>
    </div>

    <div class="card hfms-card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/expenses}" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-control" name="description" th:value="${searchDTO.description}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Category</label>
                    <select class="form-select" name="categoryId">
                        <option value="">All</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                                th:selected="${searchDTO.categoryId != null and searchDTO.categoryId == category.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status">
                        <option value="">All</option>
                        <option value="DRAFT" th:selected="${searchDTO.status != null and searchDTO.status.name() == 'DRAFT'}">Draft</option>
                        <option value="POSTED" th:selected="${searchDTO.status != null and searchDTO.status.name() == 'POSTED'}">Posted</option>
                        <option value="VOID" th:selected="${searchDTO.status != null and searchDTO.status.name() == 'VOID'}">Void</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Date From</label>
                    <input type="date" class="form-control" name="dateFrom" th:value="${searchDTO.dateFrom}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Date To</label>
                    <input type="date" class="form-control" name="dateTo" th:value="${searchDTO.dateTo}"/>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Sort By</label>
                    <select class="form-select" name="sortBy">
                        <option value="expenseDate" th:selected="${searchDTO.sortBy == 'expenseDate'}">Expense Date</option>
                        <option value="expenseNumber" th:selected="${searchDTO.sortBy == 'expenseNumber'}">Expense Number</option>
                        <option value="usdEquivalentAmount" th:selected="${searchDTO.sortBy == 'usdEquivalentAmount'}">Amount (USD)</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Direction</label>
                    <select class="form-select" name="sortDirection">
                        <option value="DESC" th:selected="${searchDTO.sortDirection == 'DESC'}">Descending</option>
                        <option value="ASC" th:selected="${searchDTO.sortDirection == 'ASC'}">Ascending</option>
                    </select>
                </div>
                <div class="col-md-8 d-flex align-items-end">
                    <button type="submit" class="btn btn-outline-primary me-2"><i class="bi bi-search me-1"></i>Search</button>
                    <a class="btn btn-outline-secondary" th:href="@{/expenses}">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card hfms-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hfms table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Expense #</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Expense Date</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${expensesPage.content.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">No expense records match the current filters.</td>
                    </tr>
                    <tr th:each="expense : ${expensesPage.content}">
                        <td><a th:href="@{/expenses/{id}(id=${expense.id})}" th:text="${expense.expenseNumber}"></a></td>
                        <td th:text="${expense.categoryName}"></td>
                        <td th:text="${expense.description}"></td>
                        <td><strong th:text="${expense.currency} + ' ' + ${#numbers.formatDecimal(expense.amount, 1, 2)}"></strong></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${expense.status.name() == 'POSTED'} ? 'bg-success' : (${expense.status.name() == 'DRAFT'} ? 'bg-secondary' : 'bg-danger')"
                                  th:text="${expense.status}"></span>
                        </td>
                        <td th:text="${#temporals.format(expense.expenseDate, 'dd MMM yyyy')}"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/expenses/{id}(id=${expense.id})}">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${expensesPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${expensesPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/expenses(page=${expensesPage.pageNumber - 1}, size=${expensesPage.pageSize}, description=${searchDTO.description}, categoryId=${searchDTO.categoryId}, status=${searchDTO.status}, dateFrom=${searchDTO.dateFrom}, dateTo=${searchDTO.dateTo}, sortBy=${searchDTO.sortBy}, sortDirection=${searchDTO.sortDirection})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Page ' + (${expensesPage.pageNumber} + 1) + ' of ' + ${expensesPage.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${expensesPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/expenses(page=${expensesPage.pageNumber + 1}, size=${expensesPage.pageSize}, description=${searchDTO.description}, categoryId=${searchDTO.categoryId}, status=${searchDTO.status}, dateFrom=${searchDTO.dateFrom}, dateTo=${searchDTO.dateTo}, sortBy=${searchDTO.sortBy}, sortDirection=${searchDTO.sortDirection})}">Next</a>
            </li>
        </ul>
    </nav>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
