<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Salaries')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: breadcrumbs(items=${ {
    {label: 'Dashboard', url: '/dashboard'},
    {label: 'Salaries', url: null}
} })}"></div>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid pb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-cash-stack me-2"></i>Salaries</h4>
        <a class="btn btn-primary" href="/salaries/new"><i class="bi bi-plus-lg me-1"></i>New Salary</a>
    </div>

    <div class="card hfms-card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/salaries}" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Employee Name</label>
                    <input type="text" class="form-control" name="employeeName" th:value="${searchDTO.employeeName}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Employee Code</label>
                    <input type="text" class="form-control" name="employeeCode" th:value="${searchDTO.employeeCode}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Month</label>
                    <select class="form-select" name="month">
                        <option value="">All</option>
                        <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${m}"
                                th:selected="${searchDTO.month != null and searchDTO.month == m}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Year</label>
                    <input type="number" class="form-control" name="year" th:value="${searchDTO.year}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="paymentStatus">
                        <option value="">All</option>
                        <option value="DRAFT" th:selected="${searchDTO.paymentStatus != null and searchDTO.paymentStatus.name() == 'DRAFT'}">Draft</option>
                        <option value="POSTED" th:selected="${searchDTO.paymentStatus != null and searchDTO.paymentStatus.name() == 'POSTED'}">Posted</option>
                        <option value="VOID" th:selected="${searchDTO.paymentStatus != null and searchDTO.paymentStatus.name() == 'VOID'}">Void</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Sort By</label>
                    <select class="form-select" name="sortBy">
                        <option value="year" th:selected="${searchDTO.sortBy == 'year'}">Year</option>
                        <option value="month" th:selected="${searchDTO.sortBy == 'month'}">Month</option>
                        <option value="salaryNumber" th:selected="${searchDTO.sortBy == 'salaryNumber'}">Salary Number</option>
                        <option value="netSalary" th:selected="${searchDTO.sortBy == 'netSalary'}">Net Salary</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Direction</label>
                    <select class="form-select" name="sortDirection">
                        <option value="DESC" th:selected="${searchDTO.sortDirection == 'DESC'}">Descending</option>
                        <option value="ASC" th:selected="${searchDTO.sortDirection == 'ASC'}">Ascending</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <button type="submit" class="btn btn-outline-primary me-2"><i class="bi bi-search me-1"></i>Search</button>
                    <a class="btn btn-outline-secondary" th:href="@{/salaries}">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card hfms-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hfms table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Salary #</th>
                        <th>Employee</th>
                        <th>Period</th>
                        <th>Basic Salary</th>
                        <th>Net Salary</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${salariesPage.content.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">No salary records match the current filters.</td>
                    </tr>
                    <tr th:each="salary : ${salariesPage.content}">
                        <td><a th:href="@{/salaries/{id}(id=${salary.id})}" th:text="${salary.salaryNumber}"></a></td>
                        <td>
                            <span th:text="${salary.employeeFullName}"></span>
                            <div class="text-muted small" th:text="${salary.employeeCode}"></div>
                        </td>
                        <td th:text="${salary.month} + '/' + ${salary.year}"></td>
                        <td th:text="${salary.currency} + ' ' + ${#numbers.formatDecimal(salary.basicSalary, 1, 2)}"></td>
                        <td><strong th:text="${salary.currency} + ' ' + ${#numbers.formatDecimal(salary.netSalary, 1, 2)}"></strong></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${salary.paymentStatus.name() == 'POSTED'} ? 'bg-success' : (${salary.paymentStatus.name() == 'DRAFT'} ? 'bg-secondary' : 'bg-danger')"
                                  th:text="${salary.paymentStatus}"></span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/salaries/{id}(id=${salary.id})}">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${salariesPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${salariesPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/salaries(page=${salariesPage.pageNumber - 1}, size=${salariesPage.pageSize}, employeeName=${searchDTO.employeeName}, employeeCode=${searchDTO.employeeCode}, month=${searchDTO.month}, year=${searchDTO.year}, paymentStatus=${searchDTO.paymentStatus}, sortBy=${searchDTO.sortBy}, sortDirection=${searchDTO.sortDirection})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Page ' + (${salariesPage.pageNumber} + 1) + ' of ' + ${salariesPage.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${salariesPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/salaries(page=${salariesPage.pageNumber + 1}, size=${salariesPage.pageSize}, employeeName=${searchDTO.employeeName}, employeeCode=${searchDTO.employeeCode}, month=${searchDTO.month}, year=${searchDTO.year}, paymentStatus=${searchDTO.paymentStatus}, sortBy=${searchDTO.sortBy}, sortDirection=${searchDTO.sortDirection})}">Next</a>
            </li>
        </ul>
    </nav>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
