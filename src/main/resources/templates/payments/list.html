<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Payments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: breadcrumbs(items=${ {
    {label: 'Dashboard', url: '/dashboard'},
    {label: 'Payments', url: null}
} } })}"></div>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid pb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-cash-coin me-2"></i>Student Payments</h4>
        <a class="btn btn-primary" href="/payments/new"><i class="bi bi-plus-lg me-1"></i>Record Payment</a>
    </div>

    <div class="card hfms-card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/payments}" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Payment #</label>
                    <input type="text" class="form-control" name="paymentNumber" th:value="${searchDTO.paymentNumber}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Receipt #</label>
                    <input type="text" class="form-control" name="receiptNumber" th:value="${searchDTO.receiptNumber}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Student Name</label>
                    <input type="text" class="form-control" name="studentName" th:value="${searchDTO.studentName}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Student Code</label>
                    <input type="text" class="form-control" name="studentCode" th:value="${searchDTO.studentCode}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Currency</label>
                    <select class="form-select" name="currencyCode">
                        <option value="">All</option>
                        <option th:each="currency : ${currencies}" th:value="${currency.code}" th:text="${currency.code}"
                                th:selected="${searchDTO.currencyCode != null and searchDTO.currencyCode.name() == currency.code}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" name="paymentMethodId">
                        <option value="">All</option>
                        <option th:each="method : ${paymentMethods}" th:value="${method.id}" th:text="${method.name}"
                                th:selected="${searchDTO.paymentMethodId != null and searchDTO.paymentMethodId == method.id}"></option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Date From</label>
                    <input type="date" class="form-control" name="dateFrom" th:value="${searchDTO.dateFrom}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Date To</label>
                    <input type="date" class="form-control" name="dateTo" th:value="${searchDTO.dateTo}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status">
                        <option value="">All</option>
                        <option value="DRAFT" th:selected="${searchDTO.status != null and searchDTO.status.name() == 'DRAFT'}">Draft</option>
                        <option value="POSTED" th:selected="${searchDTO.status != null and searchDTO.status.name() == 'POSTED'}">Posted</option>
                        <option value="CANCELLED" th:selected="${searchDTO.status != null and searchDTO.status.name() == 'CANCELLED'}">Cancelled</option>
                        <option value="REFUNDED" th:selected="${searchDTO.status != null and searchDTO.status.name() == 'REFUNDED'}">Refunded</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <button type="submit" class="btn btn-outline-primary me-2"><i class="bi bi-search me-1"></i>Search</button>
                    <a class="btn btn-outline-secondary" th:href="@{/payments}">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card hfms-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hfms table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Payment #</th>
                        <th>Receipt #</th>
                        <th>Student</th>
                        <th>Date</th>
                        <th>Original Amount</th>
                        <th>USD Equivalent</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${paymentsPage.content.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">No payments match the current filters.</td>
                    </tr>
                    <tr th:each="payment : ${paymentsPage.content}">
                        <td><a th:href="@{/payments/{id}(id=${payment.id})}" th:text="${payment.paymentNumber}"></a></td>
                        <td th:text="${payment.receiptNumber}"></td>
                        <td>
                            <a th:href="@{/students/{id}(id=${payment.studentId})}" th:text="${payment.studentFullName}"></a>
                            <div class="text-muted small" th:text="${payment.studentCode}"></div>
                        </td>
                        <td th:text="${#temporals.format(payment.paymentDate, 'dd MMM yyyy')}"></td>
                        <td th:text="${payment.currency.code} + ' ' + ${#numbers.formatDecimal(payment.originalAmount, 1, 2)}"></td>
                        <td th:text="'USD ' + ${#numbers.formatDecimal(payment.usdEquivalentAmount, 1, 2)}"></td>
                        <td th:text="${payment.paymentMethod.name}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${payment.status.name() == 'POSTED'} ? 'bg-success' : (${payment.status.name() == 'DRAFT'} ? 'bg-secondary' : 'bg-danger')"
                                  th:text="${payment.status}"></span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/payments/{id}(id=${payment.id})}">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${paymentsPage.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${paymentsPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/payments(page=${paymentsPage.pageNumber - 1}, size=${paymentsPage.pageSize}, paymentNumber=${searchDTO.paymentNumber}, receiptNumber=${searchDTO.receiptNumber}, studentName=${searchDTO.studentName}, studentCode=${searchDTO.studentCode}, currencyCode=${searchDTO.currencyCode}, paymentMethodId=${searchDTO.paymentMethodId}, dateFrom=${searchDTO.dateFrom}, dateTo=${searchDTO.dateTo}, status=${searchDTO.status})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Page ' + (${paymentsPage.pageNumber} + 1) + ' of ' + ${paymentsPage.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${paymentsPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/payments(page=${paymentsPage.pageNumber + 1}, size=${paymentsPage.pageSize}, paymentNumber=${searchDTO.paymentNumber}, receiptNumber=${searchDTO.receiptNumber}, studentName=${searchDTO.studentName}, studentCode=${searchDTO.studentCode}, currencyCode=${searchDTO.currencyCode}, paymentMethodId=${searchDTO.paymentMethodId}, dateFrom=${searchDTO.dateFrom}, dateTo=${searchDTO.dateTo}, status=${searchDTO.status})}">Next</a>
            </li>
        </ul>
    </nav>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
