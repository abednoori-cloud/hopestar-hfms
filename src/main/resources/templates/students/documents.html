<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Documents · ' + ${student.fullName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: breadcrumbs(items=${ {
    {label: 'Dashboard', url: '/dashboard'},
    {label: 'Students', url: '/students'},
    {label: ${student.studentCode}, url: '/students/' + ${student.id}},
    {label: 'Documents', url: null}
} } })}"></div>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid pb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Documents — <span th:text="${student.fullName}"></span></h4>
        <a class="btn btn-outline-secondary" th:href="@{/students/{id}(id=${student.id})}">
            <i class="bi bi-arrow-left me-1"></i>Back to Student
        </a>
    </div>

    <div class="card hfms-card mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hfms table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th>Type</th>
                        <th>File Name</th>
                        <th>Size</th>
                        <th>Uploaded</th>
                        <th>Expiry</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${documents.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">No documents uploaded yet.</td>
                    </tr>
                    <tr th:each="document : ${documents}">
                        <td th:text="${document.documentType}"></td>
                        <td th:text="${document.originalFileName}"></td>
                        <td th:text="${document.fileSizeBytes != null ? #numbers.formatDecimal(document.fileSizeBytes / 1024.0, 1, 1) + ' KB' : '—'}"></td>
                        <td th:text="${#temporals.format(document.uploadedAt, 'dd MMM yyyy HH:mm')}"></td>
                        <td>
                            <span th:if="${document.expiryDate != null}"
                                  th:text="${#temporals.format(document.expiryDate, 'dd MMM yyyy')}"></span>
                            <span th:unless="${document.expiryDate != null}">—</span>
                            <span class="badge bg-warning text-dark ms-1" th:if="${document.expiringSoon}">Expiring soon</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="${document.downloadUrl}">
                                <i class="bi bi-download"></i>
                            </a>
                            <form class="d-inline" method="post"
                                  th:action="@{/students/{id}/documents/{did}/deactivate(id=${student.id}, did=${document.id})}"
                                  onsubmit="return confirm('Remove this document? The file is kept on disk and can be recovered by an administrator.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card hfms-card">
        <div class="card-header bg-white"><strong>Upload Document</strong></div>
        <div class="card-body">
            <form method="post" th:action="@{/students/{id}/documents(id=${student.id})}"
                  th:object="${uploadDTO}" enctype="multipart/form-data" novalidate>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Document Type *</label>
                        <select class="form-select" th:field="*{documentType}"
                                th:classappend="${#fields.hasErrors('documentType')} ? 'is-invalid'">
                            <option value="PASSPORT">Passport</option>
                            <option value="DIPLOMA">Diploma</option>
                            <option value="TRANSCRIPT">Transcript</option>
                            <option value="ENGLISH_CERTIFICATE">English Certificate</option>
                            <option value="CONTRACT">Contract</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('documentType')}" th:errors="*{documentType}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Expiry Date (optional)</label>
                        <input type="date" class="form-control" th:field="*{expiryDate}"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">File *</label>
                        <input type="file" class="form-control" name="file" required
                               accept="application/pdf,image/jpeg,image/png"/>
                        <div class="form-text">PDF, JPEG, or PNG. Maximum 10 MB.</div>
                    </div>
                </div>
                <div class="d-flex justify-content-end mt-3">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i>Upload</button>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
