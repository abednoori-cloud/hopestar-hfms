<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle=${student.fullName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: breadcrumbs(items=${ {
    {label: 'Dashboard', url: '/dashboard'},
    {label: 'Students', url: '/students'},
    {label: student.studentCode, url: null}
} })}"></div>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid pb-5">

    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h4 class="mb-0" th:text="${student.fullName}">Student Name</h4>
            <span class="text-muted" th:text="${student.studentCode}">STU-2026-000001</span>
            <span class="badge ms-2" th:classappend="${student.active} ? 'badge-status-active' : 'badge-status-inactive'"
                  th:text="${student.status.name}"></span>
        </div>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/students/{id}/edit(id=${student.id})}">
                <i class="bi bi-pencil me-1"></i>Edit
            </a>
            <a class="btn btn-outline-primary" th:href="@{/students/{id}/contracts(id=${student.id})}">
                <i class="bi bi-file-earmark-text me-1"></i>Contracts
                <span class="badge bg-primary" th:text="${student.contractCount}"></span>
            </a>
            <a class="btn btn-outline-primary" th:href="@{/students/{id}/payments(id=${student.id})}">
                <i class="bi bi-cash-coin me-1"></i>Payments
            </a>
            <a class="btn btn-outline-primary" th:href="@{/students/{id}/documents(id=${student.id})}">
                <i class="bi bi-paperclip me-1"></i>Documents
                <span class="badge bg-primary" th:text="${student.documentCount}"></span>
            </a>
            <form th:if="${student.active}" class="d-inline" method="post"
                  th:action="@{/students/{id}/deactivate(id=${student.id})}"
                  onsubmit="return confirm('Deactivate this student? They can be reactivated later.');">
                <button type="submit" class="btn btn-outline-danger"><i class="bi bi-slash-circle me-1"></i>Deactivate</button>
            </form>
            <form th:unless="${student.active}" class="d-inline" method="post"
                  th:action="@{/students/{id}/reactivate(id=${student.id})}">
                <button type="submit" class="btn btn-outline-success"><i class="bi bi-check-circle me-1"></i>Reactivate</button>
            </form>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card hfms-card mb-3">
                <div class="card-header bg-white"><strong>Personal Details</strong></div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Father's Name</dt>
                        <dd class="col-sm-8" th:text="${student.fatherName ?: '—'}"></dd>

                        <dt class="col-sm-4">Phone</dt>
                        <dd class="col-sm-8" th:text="${student.phone ?: '—'}"></dd>

                        <dt class="col-sm-4">Email</dt>
                        <dd class="col-sm-8" th:text="${student.email ?: '—'}"></dd>

                        <dt class="col-sm-4">Passport Number</dt>
                        <dd class="col-sm-8" th:text="${student.passportNumber ?: '—'}"></dd>

                        <dt class="col-sm-4">Passport Expiry</dt>
                        <dd class="col-sm-8"
                            th:text="${student.passportExpiry != null ? #temporals.format(student.passportExpiry, 'dd MMM yyyy') : '—'}"></dd>

                        <dt class="col-sm-4">Notes</dt>
                        <dd class="col-sm-8" th:text="${student.notes ?: '—'}"></dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card hfms-card mb-3">
                <div class="card-header bg-white"><strong>Program</strong></div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-5">Program</dt>
                        <dd class="col-sm-7" th:text="${student.program.name}"></dd>

                        <dt class="col-sm-5">Destination</dt>
                        <dd class="col-sm-7" th:text="${student.destinationCountry}"></dd>

                        <dt class="col-sm-5">Registered</dt>
                        <dd class="col-sm-7" th:text="${#temporals.format(student.registrationDate, 'dd MMM yyyy')}"></dd>

                        <dt class="col-sm-5">Branch</dt>
                        <dd class="col-sm-7" th:text="${student.branchName ?: '—'}"></dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
