<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(pageTitle='Money In/Out Report')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: breadcrumbs(items=${ {
    {label: 'Dashboard', url: '/dashboard'},
    {label: 'Reports', url: '/reports'},
    {label: 'Money In/Out', url: null}
} })}"></div>
<div th:replace="~{fragments/layout :: flashMessages}"></div>

<div class="container-fluid pb-5" th:with="r=${report}">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Money In/Out Report</h4>
        <a class="btn btn-outline-secondary" th:href="@{/reports/cashflow/pdf(from=${r.from}, to=${r.to})}" target="_blank">
            <i class="bi bi-file-earmark-pdf me-1"></i>Download PDF
        </a>
    </div>

    <form class="card hfms-card mb-4" method="get" th:action="@{/reports/cashflow}">
        <div class="card-body d-flex align-items-end gap-3 flex-wrap">
            <div>
                <label class="form-label">From</label>
                <input type="date" class="form-control" name="from" th:value="${r.from}"/>
            </div>
            <div>
                <label class="form-label">To</label>
                <input type="date" class="form-control" name="to" th:value="${r.to}"/>
            </div>
            <div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel me-1"></i>Apply</button>
            </div>
        </div>
    </form>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card hfms-card h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Total Income (Posted)</div>
                    <div class="fs-4 fw-semibold text-success">USD <span th:text="${#numbers.formatDecimal(r.totalIncomeUsd, 1, 2)}">0.00</span></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card hfms-card h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Total Expense (Posted)</div>
                    <div class="fs-4 fw-semibold text-danger">USD <span th:text="${#numbers.formatDecimal(r.totalExpenseUsd, 1, 2)}">0.00</span></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card hfms-card h-100">
                <div class="card-body">
                    <div class="text-muted small text-uppercase">Net Position</div>
                    <div class="fs-4 fw-semibold" th:classappend="${r.netPositionUsd.signum()} >= 0 ? 'text-success' : 'text-danger'">
                        USD <span th:text="${#numbers.formatDecimal(r.netPositionUsd, 1, 2)}">0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card hfms-card">
        <div class="card-header bg-white py-3"><strong>Breakdown by Transaction Type</strong></div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-hfms mb-0">
                    <thead>
                    <tr>
                        <th>Transaction Type</th>
                        <th class="text-end">Count</th>
                        <th class="text-end">USD Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${r.breakdown}">
                        <td th:text="${row.transactionType}"></td>
                        <td class="text-end" th:text="${row.count}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(row.usdTotal, 1, 2)}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
